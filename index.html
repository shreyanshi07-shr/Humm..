function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'hum_cb_' + Math.random().toString(36).slice(2), tag = document.createElement('script');
    const done = () => { delete window[cb]; tag.remove(); };
    window[cb] = data => { done(); resolve(data); };
    tag.onerror = () => { done(); reject(); };
    tag.src = url + '&callback=' + cb; document.head.appendChild(tag);
    setTimeout(() => { if (window[cb]) { done(); reject(); } }, 9000);
  });
}
async function findPreview(s) {
  const first = s.a.split(/[ &]/)[0].toLowerCase();
  for (const term of [s.t + ' ' + s.a, s.t]) {
    try {
      const r = await jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=10&term=' + encodeURIComponent(term));
      const res = r.results || [];
      const hit = res.find(x => x.previewUrl && x.artistName.toLowerCase().includes(first) && x.trackName.toLowerCase().startsWith(s.t.toLowerCase().slice(0, 4)))
               || res.find(x => x.previewUrl && x.artistName.toLowerCase().includes(first));

  }

}

  if (enc === 0) txt = Array.from(b, c => String.fromCharCode(c)).join('');
  else if (enc === 3) txt = new TextDecoder('utf-8').decode(b);

    else if (b[0] === 0xFE && b[1] === 0xFF) { le = false; b = b.subarray(2); }
    txt = new TextDecoder(le ? 'utf-16le' : 'utf-16be').decode(b);

}

function parseID3(buf) {
  const u = new Uint8Array(buf), out = {};

  const ver = u[3], flags = u[5];
  const ss = i => (u[i] & 0x7f) << 21 | (u[i + 1] & 0x7f) << 14 | (u[i + 2] & 0x7f) << 7 | (u[i + 3] & 0x7f);
  const end = Math.min(u.length, 10 + ss(6));
  let p = 10;
  if (flags & 0x40 && ver > 2) p += ver === 4 ? ss(10) : ((u[10] << 24 | u[11] << 16 | u[12] << 8 | u[13]) + 4);
  const v2 = ver === 2, hl = v2 ? 6 : 10;
  while (p + hl < end) {
    const id = String.fromCharCode(...u.subarray(p, p + (v2 ? 3 : 4)));
    if (!/^[A-Z0-9]{3,4}$/.test(id)) break;
    const size = v2 ? (u[p + 3] << 16 | u[p + 4] << 8 | u[p + 5]) : ver === 4 ? ss(p + 4) : (u[p + 4] << 24 | u[p + 5] << 16 | u[p + 6] << 8 | u[p + 7]) >>> 0;
    if (size <= 0 || p + hl + size > end) break;
    const d = u.subarray(p + hl, p + hl + size);
    if ((id === 'TIT2' || id === 'TT2') && !out.title) out.title = decodeText(d[0], d.subarray(1));
    if ((id === 'TPE1' || id === 'TP1') && !out.artist) out.artist = decodeText(d[0], d.subarray(1));
    if ((id === 'APIC' || id === 'PIC') && !out.picture) {
      const enc = d[0]; let q, mime;
      if (v2) { mime = 'image/' + String.fromCharCode(d[1], d[2], d[3]).toLowerCase().replace('jpg', 'jpeg'); q = 5; }
      else { q = skipString(d, 1, 0); mime = String.fromCharCode(...d.subarray(1, q - 1)) || 'image/jpeg'; q += 1; }
      q = skipString(d, q, enc);
      if (!mime.includes('/')) mime = 'image/' + mime.toLowerCase();
      out.picture = new Blob([d.slice(q)], { type: mime });

}
function audioDuration(url) {

    const a = new Audio(); a.preload = 'metadata';
    a.onloadedmetadata = () => res(Math.round(a.duration) || 0);
    a.onerror = () => res(0); a.src = url; setTimeout(() => res(0), 6000);
  });
}
function tintFrom(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 12;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, 12, 12);
        const px = x.getImageData(0, 0, 12, 12).data; let r = 0, g = 0, b = 0;
        for (let i = 0; i < px.length; i += 4) { r += px[i]; g += px[i + 1]; b += px[i + 2]; }
        const n = px.length / 4; r /= n; g /= n; b /= n;
        const hex = (R, G, B) => '#' + [R, G, B].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
        res({ c1: hex(r, g, b), c2: hex(r, g, b), bg: hex(r + (255 - r) * .82, g + (255 - g) * .82, b + (255 - b) * .82) });
      } catch (e) { res({}); }
    };

}
function nameFromFile(fname) {

  const parts = n.split(/\s+-\s+/);
  return parts.length > 1 ? { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() } : { title: n };
}

        : `<div class="letter-body">

        ${S.messages.length ? '<button class="press letter-all" data-act="allnotes">read all our notes →</button>' : ''}
      </section>
    </div>
  </div>`;
}

/* ----- Add song ----- */

      <div class="batch-bar"><i style="width:${pct}%"></i></div>

      <button class="press up-cover" data-act="pickcover" aria-label="Choose cover photo">
        ${u.img ? `<img src="${u.img}" alt="" style="width:100%;height:100%;object-fit:cover">`
                : `<span style="color:#A3A9B6;display:flex">${svg(48, '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>', 'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"')}</span>`}
        <span class="up-cover-btn">${icoCamera} ${u.img ? 'Change cover' : 'Add cover photo'}</span>
      </button>
      <div class="muted" style="font-size:12px;margin-top:10px">${src}</div>
    </div>
    <div class="px" style="margin-top:20px;display:flex;flex-direction:column;gap:12px">
      <label class="field"><span>Title</span><input id="upT" value="${esc(u.t)}" autocomplete="off"></label>
      <label class="field"><span>Artist</span><input id="upA" value="${esc(u.a)}" autocomplete="off"></label>
      <label class="field note-field"><span>A note for ${P.name} <em>(optional)</em></span>

}

/* ----- Our Songs ----- */
function listRows() {
  const q = S.query.trim().toLowerCase();
  const ids = ALL.filter(id => { const s = song(id); return !q || (s.t + ' ' + s.a).toLowerCase().includes(q); });
  if (!ALL.length) return `<div class="lib-empty">
      <span style="color:var(--accent);display:flex">${flower(70)}</span>
      <div class="lib-empty-t">No songs yet</div>
      <p>Add the songs that are yours. They'll live here for both of you.</p>
      <button class="press ob-btn small" data-act="tab" data-tab="upload" style="max-width:220px">Add your first song</button>
    </div>`;
  if (!ids.length) return `<div style="padding:50px 40px;text-align:center"><div style="font-size:15px;font-weight:700">Nothing called “${esc(S.query)}” yet</div>
    <div class="muted" style="font-size:13px;margin-top:6px">Add it from the Add song tab.</div></div>`;
  return ids.map((id, n) => songRow(id, n)).join('');
}
function historyList() {
  const days = [];
  S.history.forEach(h => { let d = days.find(x => x.day === h.day); if (!d) days.push(d = { day: h.day, items: [] }); d.items.push(h); });
  return days.map(d => `
    <div class="label px" style="padding-top:16px;padding-bottom:6px">${d.day}</div>
    ${d.items.map(h => { const s = song(h.id);
      const icon = h.type === 'together' ? pair(26)
        : h.type === 'added' ? `<div class="avatar" style="width:30px;height:30px;background:var(--accent-soft);color:var(--accent)">${I.plus(14)}</div>`
        : avatar(who(h.type), 30);
      const text = h.type === 'together' ? `Listened together · ${h.mins} min`
        : h.type === 'added' ? `${h.by === 'K' ? P.name : 'You'} added this`
        : h.type === 'K' ? `${P.name} listened` : 'You listened';
      return `<button class="row press" data-act="play" data-id="${s.id}" data-ctx="Our history" style="width:100%;gap:12px;padding:8px 24px">
        <div style="width:44px;display:flex;justify-content:center">${icon}</div>
        ${cover(s, 42, 10, 'none')}
        <div style="flex:1;min-width:0">
          <div class="ell" style="font-size:14px;font-weight:600">${esc(s.t)} <span class="muted" style="font-weight:500">· ${esc(s.a)}</span></div>
          <div class="muted" style="font-size:12px;margin-top:2px">${text}</div>
        </div>
        <div class="muted" style="font-size:11px;white-space:nowrap">${h.time}</div>
      </button>`; }).join('')}`).join('');
}
function songsScreen() {
  const together = S.history.filter(h => h.type === 'together').reduce((a, h) => a + h.mins, 0);
  return `<div class="pad">
    <div class="sticky-head songs-head">
    <div class="px" style="display:flex;align-items:center;justify-content:space-between">

/* ================= CHROME ================= */

  </div>`;
}

function subscribe() {

  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'notes', filter: 'couple_id=eq.' + cid }, onNoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'songs', filter: 'couple_id=eq.' + cid }, onSongChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'couples', filter: 'id=eq.' + cid }, onCoupleChange)

}
function songRow(id, n, o) {
  o = o || {};
  const s = song(id), by = who(s.by), cur = S.curId === id;
  const acts = o.pl
    ? `<button class="sw-act rm" data-act="plremove" data-pl="${o.pl}" data-id="${id}" tabindex="-1">${svg(18, '<path d="M5 12h14"/>')}<span>Remove</span></button>`
    : `<button class="sw-act pl" data-act="addto" data-id="${id}" tabindex="-1">${svg(18, '<path d="M4 6h11M4 12h11M4 18h7M18 13v8M14 17h8"/>')}<span>Playlist</span></button><button class="sw-act sw-del" data-act="delsong" data-id="${id}" aria-label="Delete ${esc(s.t)}" tabindex="-1">${icoTrash}<span>Delete</span></button>`;
  return `<div class="sw-row" data-id="${id}" data-w="${o.pl ? 88 : 172}">
    <div class="sw-acts">${acts}</div>
    <button class="press song-row ${cur ? 'cur' : ''}" data-act="play" data-id="${id}" data-ctx="${esc(o.pl ? plById(o.pl).name : 'Our Songs')}" ${o.pl ? `data-pl="${o.pl}"` : ''} aria-label="Play ${esc(s.t)} by ${esc(s.a)}">
      <span class="sr-num">${cur ? eq() : String(n + 1).padStart(2, '0')}</span>
      ${cover(s, 52, 12)}
      <span class="sr-text">
        <span class="sr-title ell">${esc(s.t)}</span>
        <span class="sr-sub"><span class="avatar" title="Added by ${by.name}" style="width:16px;height:16px;font-size:9px;background:${by.col};color:${by.tc};font-family:Quicksand,sans-serif">${by.ini}</span><span class="ell">${esc(s.a)}</span></span>
      </span>
      <span class="sr-note">${notesOf(id).length ? `<span title="There's a note on this one">${icoPaper}</span>` : ''}</span>
      <span class="sr-dur">${fmt(s.d)}</span>
    </button></div>`;
}
function plSheets() {
  if (S.plSheet) {
    const m = S.plSheet, p = m.id && plById(m.id);
    return sheetWrap('plsheet', `
      <div class="ob-h" style="font-size:24px">${m.mode === 'rename' ? 'Rename playlist' : 'New playlist'}</div>
      <label class="ob-field" style="margin-top:16px"><span>Name</span><input id="plName" maxlength="60" placeholder="e.g. rainy days" value="${esc(p ? p.name : '')}" autocomplete="off"></label>
      <div class="inv-sheet-foot"><button class="press ob-btn" data-act="plsave">${m.mode === 'rename' ? 'Save' : 'Create'}</button></div>`);
  }
  if (S.plMenu) {
    const p = plById(S.plMenu); if (!p) return '';
    return sheetWrap('plmenu', S.plConfirm ? `
      <div class="del-card" style="margin-top:0"><div class="del-t">Delete “${esc(p.name)}”?</div><p>The playlist goes for both of you. The songs stay in Our Songs.</p>
      <div class="del-actions"><button class="press ob-btn small ghost" data-act="plmenuclose">Keep it</button><button class="press ob-btn small del-yes" data-act="pldelete">Delete</button></div></div>` : `
      <div class="ob-h" style="font-size:22px" >${esc(p.name)}</div>
      <div class="menu-list">
        <button class="press" data-act="plrename">${icoPen} Rename</button>
        <button class="press" data-act="plpick" data-id="${p.id}">${I.plus(16)} Add or remove songs</button>
        <button class="press danger" data-act="plconfirm">${icoTrash} Delete playlist</button>
      </div>`);
  }
  if (S.plPick) {
    const p = plById(S.plPick); if (!p) return '';
    return sheetWrap('plpick', `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div class="ob-h" style="font-size:22px">Add to ${esc(p.name)}</div><button class="press pl-done" data-act="sheetclose">Done</button></div>
      <div class="pick-list">${ALL.length ? ALL.map(id => { const s = song(id), on = p.songs.includes(id); return `<button class="press pick-row ${on ? 'on' : ''}" data-act="pltoggle" data-pl="${p.id}" data-id="${id}" aria-pressed="${on}">
        ${cover(s, 42, 10)}<span class="find-tx"><b class="ell">${esc(s.t)}</b><span class="ell">${esc(s.a)}</span></span><span class="pick-check">${on ? svg(14, '<path d="m5 12.5 4.5 4.5L19 7.5"/>', 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"') : ''}</span></button>`; }).join('')
        : '<div class="find-empty">Add songs to Our Songs first.</div>'}</div>`);
  }
  if (S.addTo) {
    const s = song(S.addTo);
    return sheetWrap('addto', `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div style="min-width:0"><div class="ob-h ell" style="font-size:22px">Add to a playlist</div><div class="muted ell" style="font-size:13px;margin-top:2px">${esc(s.t)} · ${esc(s.a)}</div></div><button class="press pl-done" data-act="sheetclose">Done</button></div>
      <div class="pick-list">
        <button class="press pick-row" data-act="plnew" data-song="${S.addTo}"><span class="pl-art empty" style="width:42px;height:42px">${I.plus(18)}</span><span class="find-tx"><b>New playlist</b><span>with this song in it</span></span></button>
        ${PL.map(p => { const on = p.songs.includes(S.addTo); return `<button class="press pick-row ${on ? 'on' : ''}" data-act="pltoggle" data-pl="${p.id}" data-id="${S.addTo}" aria-pressed="${on}">
          ${coverMosaic(plSongs(p.id), 42)}<span class="find-tx"><b class="ell">${esc(p.name)}</b><span>${plSongs(p.id).length} songs</span></span><span class="pick-check">${on ? svg(14, '<path d="m5 12.5 4.5 4.5L19 7.5"/>', 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"') : ''}</span></button>`; }).join('')}
      </div>`);
  }
  return '';
}
function sheetWrap(key, inner) {
  return `<div class="sheet-wrap">
    <button class="sheet-backdrop ${OPENED.pl ? 'fadeIn' : ''}" data-act="sheetclose" aria-label="Close"></button>
    <div class="note-sheet pl-sheet ${OPENED.pl ? 'sheetUp' : ''}" style="background:#fff" role="dialog">
      <div style="width:40px;height:5px;border-radius:3px;background:#E3E4E8;margin:0 auto 14px"></div>${inner}</div></div>`;
}
const plSheetOpen = () => !!(S.plSheet || S.plMenu || S.plPick || S.addTo);
function closePlSheets() { Object.assign(S, { plSheet: null, plMenu: null, plPick: null, addTo: null, plConfirm: false }); }
async function plAction(act, d) {
  switch (act) {
    case 'libtab': S.lib = d.v; S.openPl = null; render(); return true;
    case 'plopen': S.openPl = d.id; render(); app.querySelector('.scroll').scrollTop = 0; return true;
    case 'plback': S.openPl = null; render(); return true;
    case 'plnew': closePlSheets(); S.plSheet = { mode: 'new', song: d.song || null }; render(); setTimeout(() => { const i = document.getElementById('plName'); if (i) i.focus(); }, 350); return true;
    case 'plrename': { const id = S.plMenu; closePlSheets(); S.plSheet = { mode: 'rename', id }; render(); setTimeout(() => { const i = document.getElementById('plName'); if (i) i.focus(); }, 350); return true; }
    case 'plsave': {
      const m = S.plSheet, name = ((document.getElementById('plName') || {}).value || '').trim();
      if (!name) { flash('Give it a name'); return true; }
      if (m.mode === 'rename') {
        const p = plById(m.id); const old = p.name; p.name = name.slice(0, 60); closePlSheets(); render();
        const r = await CLOUD.sb.from('playlists').update({ name: p.name }).eq('id', p.id);
        if (r.error) { p.name = old; render(); flash(cloudErr(r.error, 'Couldn’t rename it')); }
      } else {
        closePlSheets(); const id = await createPlaylist(name, m.song);
        if (id) { if (!m.song) { S.tab = 'songs'; S.lib = 'playlists'; S.openPl = id; } render(); flash(m.song ? `Added to ${name}` : `“${name}” is ready · add some songs`); }
      }
      return true;
    }
    case 'plmenu': closePlSheets(); S.plMenu = d.id; render(); return true;
    case 'plmenuclose': closePlSheets(); render(); return true;
    case 'plconfirm': S.plConfirm = true; render(); return true;
    case 'pldelete': {
      const p = plById(S.plMenu); closePlSheets(); if (!p) return true;
      PL = PL.filter(x => x.id !== p.id); if (S.openPl === p.id) S.openPl = null; render();
      const r = await CLOUD.sb.from('playlists').delete().eq('id', p.id);
      if (r.error) { await loadPlaylists(); render(); flash(cloudErr(r.error, 'Couldn’t delete it')); } else flash(`Deleted “${p.name}”`);
      return true;
    }
    case 'plpick': closePlSheets(); S.plPick = d.id; render(); return true;
    case 'pltoggle': togglePlSong(d.pl, d.id); return true;
    case 'plremove': { const p = plById(d.pl); swipeOpen = null; await togglePlSong(d.pl, d.id); if (p) flash(`Removed from ${p.name}`, true); return true; }
    case 'addto': swClose(); closePlSheets(); S.addTo = d.id; render(); return true;
    case 'sheetclose': closePlSheets(); render(); return true;
    case 'plplay': { const ids = plSongs(d.id); if (ids.length) { play(ids[0], ids, plById(d.id).name); S.overlay = 'player'; render(); } return true; }
  }
  return false;
}

/* clocks: your playback, and your person's when they listen on their own */
setInterval(() => {
  const pt = S.partner;
  if (pt.status === 'listening') { pt.prog += 1; if (pt.prog >= song(pt.songId).d) pt.prog = 0; }
  if (S.playing) {
    if (hasAudio(S.curId) && audioId === S.curId) S.progress = audio.currentTime;
    else { S.progress++; if (S.progress >= song(S.curId).d) return skip(1); }
  }
  updateProgress();
}, 1000);

render();
cloudStart();


/* installable app: offline cache + home-screen install (only when served over http/https) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
