<style>
:root{--accent:var(--accent);--accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);--accent-shadow:color-mix(in srgb,var(--accent) 32%,transparent);--ink:#17171C;--muted:#6B6B76;--line:#EFEFF2;--lav:#7C8597;--lav-ink:#111318;--lav-mid:var(--accent-mid);--paper:#F4F4F4}
.display,.title{font-family:'Quicksand','Plus Jakarta Sans',sans-serif}
.title{font-weight:700!important}
/* playback-driven motion (toggled via .is-playing on the phone, so nothing re-renders) */
.spin{animation:spin 6s linear infinite}
.phone:not(.is-playing) .spin,.phone:not(.is-playing) .eq i{animation-play-state:paused}
.phone.is-playing .ic-play,.phone:not(.is-playing) .ic-pause{display:none}
.ic-play,.ic-pause{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,rgba(255,255,255,0) 0 3px,rgba(110,120,150,.11) 3px 4px),rgba(250,249,253,.5);-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);border:1px solid rgba(255,255,255,.95);box-shadow:0 26px 54px rgba(20,30,60,.20),inset 0 0 0 1px rgba(190,184,214,.35)}
.sheen{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 205deg,transparent 0deg,rgba(255,255,255,.7) 22deg,transparent 50deg,transparent 180deg,rgba(255,255,255,.5) 202deg,transparent 230deg);pointer-events:none}
.disc-label{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);background:#F6F3FC;box-shadow:inset 0 0 0 1px rgba(160,150,200,.2),0 1px 0 #fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.spindle{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(80,70,120,.25),inset 0 0 0 1px #E3DFEC;display:flex;align-items:center;justify-content:center}
.spindle i{width:6px;height:6px;border-radius:50%;background:#1E1B2A}
.ease-slow{transition:transform .8s cubic-bezier(.3,.8,.3,1)}
.tonearm{position:absolute;transform-origin:60px 56px;transform:rotate(-17deg)}
.phone.is-playing .tonearm{transform:rotate(5deg)}
.sleeve{transform:translateX(-34px) rotate(-7deg)}
.phone.is-playing .sleeve{transform:translateX(-14px) rotate(-3deg)}
.vinyl-wrap{transform:translateX(-30px)}
.phone.is-playing .vinyl-wrap{transform:none}
.soft-ctl{border-radius:50%;background:#FAF9FC;border:1px solid #E4E4E8;box-shadow:inset 0 1px 0 #fff,0 8px 22px rgba(20,30,60,.12);color:var(--lav);display:flex;align-items:center;justify-content:center}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:80;mix-blend-mode:multiply}
.wobble:hover{animation:wobble .5s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F2F2F5;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit}
h1,h2{margin:0}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#fff;border-radius:44px;box-shadow:0 30px 80px rgba(20,20,30,.18),0 0 0 10px #fff,0 0 0 11px #E2E2E8}
@media (max-width:500px){body{display:block}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.hscroll,.scroll{scrollbar-width:none}.hscroll::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.hscroll{display:flex;overflow-x:auto}
.pad{padding:56px 0 180px}
.px{padding-left:24px;padding-right:24px}
.title{font-size:28px;font-weight:800;letter-spacing:-.02em}
.h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;transition:background-color .2s}
.row:hover{background:#F6F6F8}
.press{transition:transform .16s ease,background-color .2s,opacity .2s}
.press:active{transform:scale(.95)}
.lift{transition:transform .25s cubic-bezier(.2,.8,.2,1)}.lift:hover{transform:translateY(-3px)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.cover{position:relative;overflow:hidden;flex-shrink:0}
.cover .c1{position:absolute;width:72%;height:72%}
.cover .c2{position:absolute;left:12%;bottom:13%;width:36%;height:8%;border-radius:4px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;position:relative}
.live-dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#2EAA6E;border:2px solid #fff}
.pill{height:38px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.accent-btn{background:var(--accent);color:#fff}
.soft-btn{background:var(--accent-soft);color:var(--accent)}
.screen{animation:fadeUp .34s cubic-bezier(.2,.8,.2,1) both}
.sheetUp{animation:slideUp .42s cubic-bezier(.2,.85,.2,1) both}
.fadeIn{animation:fadeIn .25s ease both}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{display:block;width:3px;border-radius:2px;background:var(--accent);animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.eq.green i{background:#2EAA6E}
.pulse{animation:pulse 1.8s ease-out infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.floatUp{animation:floatUp 1.3s ease-out forwards}
.toast{position:absolute;top:18px;left:50%;z-index:60;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 32px);box-sizing:border-box;box-shadow:0 10px 24px rgba(20,20,30,.2);animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both}
.bar{transition:width .9s linear}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,170,110,.45)}100%{box-shadow:0 0 0 7px rgba(46,170,110,0)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:.15}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-14px) scale(1)}100%{opacity:0;transform:translateY(-150px) scale(1.15)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.overlay{position:absolute;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;padding:48px 24px 26px}
.mini{position:absolute;left:12px;right:12px;bottom:90px;z-index:5;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(20,20,30,.12),0 0 0 1px rgba(20,20,30,.05);overflow:hidden}
nav{position:absolute;left:0;right:0;bottom:0;height:82px;z-index:6;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px 0}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;color:#8A8A94;position:relative}
nav button.on{color:var(--accent)}
nav span.t{font-size:11px;font-weight:600}
.search-box{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:#F3F3F6;color:var(--muted)}
.search-box input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* two-person refinements */
.partner-card{border:1px solid #E8E8EC;border-radius:24px;padding:16px;background:#fff;box-shadow:0 10px 30px rgba(20,30,60,.07)}
.listen-btn{width:100%;height:56px;margin-top:14px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;box-shadow:0 12px 26px var(--accent-shadow)}
.note{font-family:'Quicksand',sans-serif;font-weight:600;color:var(--lav-mid)}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid #E4E4E8;font-size:13px;font-weight:600;color:var(--lav-ink);background:#fff}
.add-pill{height:34px;padding:0 12px;border-radius:999px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex-shrink:0;margin-right:6px}
.add-pill.on{background:#fff;border:1px solid #E4E4E8;color:var(--lav-mid)}
.seg{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#EFEFF1;border-radius:14px;padding:4px}
.seg-bg{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:11px;background:#fff;box-shadow:0 2px 8px rgba(20,30,60,.12);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.seg button{position:relative;height:38px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--ink)}
.together-pill{height:46px;padding:0 20px;border-radius:999px;background:#fff;border:1px solid #E4E4E8;color:var(--lav-ink);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;box-shadow:0 6px 16px rgba(20,30,60,.08)}
.together-pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.phone:not(.is-playing) .eq.always i{animation-play-state:running}
.eq.always i{background:#2EAA6E}
.beat{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.waiting{animation:waitRing 1.6s ease-out infinite}
@keyframes waitRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent)}}

/* nav: Home · Add song · Our Songs */
.nav-add{color:var(--lav-mid)}
.nav-add-circle{width:46px;height:46px;margin-top:-20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px var(--accent-shadow),0 0 0 5px #fff;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.nav-add:hover .nav-add-circle{transform:translateY(-2px) rotate(90deg)}
.nav-add.on .t{color:var(--accent)}
/* add song */
.dropzone{width:100%;height:220px;border-radius:26px;border:1.5px dashed #DADCE2;background:#FBFAFD;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dropzone:hover{background:#F7F5FC;border-color:var(--accent)}
.up-cover{position:relative;width:200px;height:200px;border-radius:24px;overflow:hidden;background:#EFEFF1;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(20,30,60,.16)}
.up-cover-btn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--lav-ink);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(20,20,30,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:700;color:var(--lav-mid)}
.field em{font-style:normal;font-weight:500;color:var(--muted)}
.field input,.field textarea{border:1px solid #E4E4E8;border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink);background:#fff;outline:none;resize:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note-field textarea{font-family:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;font-size:21px;line-height:1.2;background:#FBF9F4;border-color:#ECE6D6}
/* the hidden notes: a sleeve that flips over */
.vinyl-wrap{z-index:1;pointer-events:none}.sleeve-wrap{z-index:0;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.sleeve-wrap.open{z-index:6;transform:translate(70px,8px) scale(1.12)}
.sleeve-wrap.open .sleeve{transform:none!important}
.dim{opacity:.15;transition:opacity .4s}
.flip{position:relative;width:220px;height:220px;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.8,.3,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:6px}
.face.front{display:block}
.face.back{transform:rotateY(180deg);background:#FBF9F4;box-shadow:0 18px 40px rgba(20,30,60,.22);padding:12px 12px 10px;display:flex;flex-direction:column;overflow:hidden}
.notes{flex:1;overflow-y:auto;margin-top:4px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.notes::-webkit-scrollbar{display:none}
.hand{font-family:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;font-size:18px;line-height:1.1;color:#3B3550}
.hand.from-k{color:#8A4A22}.hand.from-a{color:var(--accent-ink);text-align:right}

/* floating dock nav */
nav.dock{position:absolute;left:18px;right:18px;bottom:20px;height:auto;z-index:6;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;grid-template-columns:none}
.dock-pill{flex:1;height:64px;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:linear-gradient(#FFFFFF,#FAF9FC);border:1px solid #E6E6EA;box-shadow:0 14px 34px rgba(20,30,60,.13),inset 0 1px 0 #fff}
.dock-item{flex:1;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:9px;color:#8A90A0;padding:0 14px;transition:flex-grow .4s cubic-bezier(.2,.8,.2,1),background-color .3s,color .3s}
.dock-item.on{flex:1.9;background:var(--accent-tint);color:#17171C}
.dock-ico{display:flex}
.dock-label{font-size:14px;font-weight:600;white-space:nowrap;max-width:0;overflow:hidden;opacity:0;transition:max-width .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.dock-item.on .dock-label{max-width:110px;opacity:1}
.dock-add{width:64px;height:64px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);background:linear-gradient(#FFFFFF,#FAF9FC);border:1px solid #E6E6EA;box-shadow:0 14px 34px rgba(20,30,60,.13),inset 0 1px 0 #fff;transition:background-color .3s,color .3s,transform .16s}
.dock-add svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dock-add:hover svg{transform:rotate(90deg)}
.dock-add.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 14px 30px var(--accent-shadow)}
.mini{bottom:98px}
nav.dock button{flex-direction:row;padding-top:0}
nav.dock::before{content:'';position:absolute;left:-18px;right:-18px;bottom:-20px;height:106px;background:linear-gradient(rgba(255,255,255,0),#fff 55%);z-index:-1;pointer-events:none}

/* ===== vibe refresh: soft grey canvas, lifted white cards, chunky type, mono details ===== */
:root{--canvas:#F3F3F5}
.phone{background:var(--canvas)!important}
.title{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif!important;font-weight:800!important;font-size:34px;letter-spacing:-.035em;line-height:1.02;color:#121218}

.hero{position:relative;height:226px;border-radius:28px;overflow:hidden;box-shadow:0 22px 40px rgba(20,30,60,.16)}

.glass{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.35);color:#fff}
.chip{height:28px;padding:0 11px;border-radius:999px;display:flex;align-items:center;gap:7px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.05em;background:rgba(20,16,36,.28)}

.mix-card{position:relative;flex-shrink:0;width:156px;height:180px;border-radius:24px;overflow:hidden;box-shadow:0 14px 28px rgba(20,30,60,.13);display:block}

.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:76px;gap:10px;grid-template-areas:"a a b b" "c d b b" "e e e f"}
.tile{border-radius:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 16px;text-align:left;gap:5px}

.dropzone,.mini,.dock-pill,.dock-add:not(.on){box-shadow:0 14px 34px rgba(30,30,50,.08)!important}
.dropzone{background:#fff!important;border-color:#DADCE2!important}
.seg{background:#E9E8EE!important}

.search-box{background:#fff!important;box-shadow:0 8px 20px rgba(30,30,50,.05)}

/* ===== home: message, listening strip, right now ===== */
.msg-card{position:relative;background:#FBF9F4;border:1px solid #EFE9DA;border-radius:24px;padding:16px 18px 14px;box-shadow:0 14px 30px rgba(60,50,30,.07)}

.typing{margin-top:8px;font-size:12px;color:#8F8770;display:flex;align-items:center;gap:3px}
.typing span{width:5px;height:5px;border-radius:50%;background:#B8AF96;animation:typing 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s;margin-right:5px}
@keyframes typing{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.strip{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 12px 12px 14px;box-shadow:0 12px 30px rgba(30,30,50,.06)}

.join-btn{height:38px;padding:0 18px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;flex-shrink:0;box-shadow:0 8px 18px var(--accent-shadow)}
.join-btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.now-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.now-card{border-radius:22px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.now-card.him{background:linear-gradient(150deg,#FFF1E6,#FBDCC6)}
.now-card.mine{background:linear-gradient(150deg,#F1EEFD,#E1DBFA)}
.now-card.mine.empty .now-text{color:var(--accent-dim)}
.now-text{font-size:22px;line-height:1.05;color:#2F2A40}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid #E4E4E8;font-size:13px;font-weight:600;color:var(--lav-ink);transition:background-color .2s,color .2s,border-color .2s}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
.think-btn{width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(30,30,50,.06);font-size:14px;transition:box-shadow .5s}

.think-btn.glow{box-shadow:0 0 0 6px rgba(247,178,103,.25),0 16px 34px rgba(247,178,103,.35)}
.think-btn.glow .think-ico{transform:rotate(90deg) scale(1.1)}

/* ===== notification banner ===== */
.banner{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:12px;padding:10px 8px 10px 12px;border-radius:22px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 40px rgba(30,30,50,.18),0 0 0 1px rgba(30,30,50,.05);animation:dropIn .5s cubic-bezier(.2,.9,.2,1.1) both}
@keyframes dropIn{from{transform:translateY(-130%)}to{transform:none}}

/* ===== now playing: centred, scales to any screen ===== */
.overlay.pl{background:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

.stage-box{position:absolute;left:50%;top:50%;width:390px;height:340px;transform-origin:center;transform:translate(-50%,-50%)}

.pl-progress{padding:2px 28px 0}

.pl-actions{display:flex;justify-content:center;gap:10px;margin-top:14px;padding:0 16px;flex-wrap:wrap}
.pl-actions .together-pill{height:44px;padding:0 16px;font-size:13px}
.badge{position:absolute;right:4px;top:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.vinyl-wrap{pointer-events:none}
#stage{min-height:180px}

/* ===== notes sheet ===== */
.sheet-wrap{position:absolute;inset:0;z-index:40}
.sheet-backdrop{position:absolute;inset:0;width:100%;background:rgba(20,18,30,.3)}
.note-sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:#FBF9F4;border-radius:28px 28px 0 0;padding:10px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(30,20,10,.15)}

/* ===== any phone: full-bleed on small screens, safe areas, short screens ===== */

  body{display:block;background:var(--canvas)}

}

@media (max-width:360px){ .px{padding-left:16px;padding-right:16px} .now-text{font-size:19px} .msg-text{font-size:21px} }

/* ===== Focus-style theme: light grey, cobalt blue, tight black headings ===== */
:root{--accent:var(--accent);--accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);--accent-shadow:color-mix(in srgb,var(--accent) 30%,transparent);--ink:#111318;--muted:#6B7080;--line:#E6E6EA;--canvas:#F3F3F3;--paper:#F4F4F4;--blue-sub:var(--accent-mid);--lav:#7C8597;--lav-ink:#111318;--lav-mid:var(--accent-mid)}
html,body{background:#E9E9E9}
body,.phone{font-family:'Inter Tight','Plus Jakarta Sans',system-ui,sans-serif}
.phone{background:var(--canvas)!important;border-radius:40px;box-shadow:0 30px 80px rgba(20,20,30,.12)!important}
.title,.display,.h-xl,.sec-head h2{font-family:'Inter Tight','Plus Jakarta Sans',sans-serif!important;letter-spacing:-.03em}
.title{font-weight:800!important;color:var(--ink)}
.top-bar{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Yellowtail','Pacifico',cursive;font-size:40px;line-height:1;color:var(--accent);transform:rotate(-6deg);margin-left:2px;letter-spacing:0}
.pair-badge{padding:7px 9px;border-radius:16px;background:#fff;box-shadow:0 8px 20px rgba(20,30,60,.08)}
.h-xl{margin:0;font-weight:800;font-size:clamp(26px,7.6vw,30px);line-height:1.05;color:var(--ink)}
.blue-sub{font-size:13px;color:var(--blue-sub);font-weight:500}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding-top:28px;padding-bottom:14px}
.sec-head h2{margin:0;font-weight:800;font-size:24px}
.see-all{font-size:15px;font-weight:500;color:var(--blue-sub);min-height:32px}
.mono-label{font-family:'Inter Tight',sans-serif!important;letter-spacing:.01em;text-transform:none;font-size:12px;color:var(--muted)}

/* hero (Kabir) */
.hero{position:relative;height:196px;border-radius:26px;overflow:hidden;box-shadow:0 26px 40px -14px rgba(20,30,60,.35)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,30,0) 35%,rgba(10,14,30,.62))}

.hero-pill{height:38px;padding:0 15px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#fff;background:rgba(40,40,48,.42);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);flex-shrink:0}

.rp-row:hover{background:rgba(255,255,255,.7)}
.rp-who{display:flex;padding-right:4px}

.think-ico{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#FFE7A3,#F7B267);color:#8A4A10;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .5s}

/* little notes */

/* chrome in the new palette */
.dock-item.on{background:var(--accent-tint)!important;color:var(--accent)!important}

/* ===== white, flat, quiet ===== */

.list-card,.strip,.dock-pill,.dock-add:not(.on),.dropzone,.now-card,.msg-card,.think-btn,.pair-badge,.search-box,.st-ico,.mini,.banner{box-shadow:none!important}

.list-card{background:#fff!important;padding:0;border-radius:0}
.list-card .row{border-radius:14px}
.mini,.dock-pill,.dock-add:not(.on){border:1px solid #EAEAEC!important;background:#fff!important}
.st-tile.on .st-ico{background:var(--accent)!important;box-shadow:none!important}

.mix-card,.hero{box-shadow:none!important}

.disc{box-shadow:0 18px 36px rgba(20,30,60,.10),inset 0 0 0 1px rgba(190,190,200,.35)!important}

.banner{border:1px solid #EAEAEC}

/* ===== now playing widget (Kabir) ===== */
.np-widget{position:relative;height:172px;border-radius:30px;overflow:hidden;display:flex;align-items:stretch;color:#fff;isolation:isolate}
.np-bg{position:absolute;inset:-30px;z-index:-2}
.np-bg img{width:100%;height:100%;object-fit:cover;filter:blur(28px) saturate(1.1);transform:scale(1.2)}
.np-tint{position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,rgba(70,74,84,.78),rgba(96,100,110,.55))}
.np-text{flex:1;min-width:0;display:flex;flex-direction:column;padding:20px 0 18px 22px}
.np-label{font-size:15px;font-weight:500;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:8px}
.np-dot{width:7px;height:7px;border-radius:50%;background:#3DDC97}
.np-artist{font-size:14px;color:rgba(255,255,255,.72)}
.np-title{font-size:23px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.np-join{margin-top:10px;height:32px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:#16181D;font-size:12.5px;font-weight:700}
.np-deck{position:relative;width:168px;flex-shrink:0}
.np-record{position:absolute;right:20px;top:50%;width:134px;height:134px;margin-top:-67px;border-radius:50%;background:repeating-radial-gradient(circle,#141518 0 2px,#1C1D21 2px 3px);box-shadow:0 10px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;animation:spin 6s linear infinite;animation-play-state:paused}
.np-widget.spinning .np-record{animation-play-state:running}
.np-label-art{position:relative;width:84px;height:84px;border-radius:50%;overflow:hidden;background:#ddd}
.np-label-art img{width:100%;height:100%;object-fit:cover}
.np-hole{position:absolute;width:8px;height:8px;border-radius:50%;background:#111;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.np-arm{position:absolute;right:2px;top:10px;transform-origin:40px 14px;transform:rotate(-14deg);transition:transform .8s cubic-bezier(.3,.8,.3,1)}
.np-widget.spinning .np-arm{transform:rotate(6deg)}
@media (max-width:360px){ .np-deck{width:140px} .np-record{width:112px;height:112px;margin-top:-56px;right:14px} .np-label-art{width:70px;height:70px} .np-title{font-size:20px} }

/* Our Songs rows on a fixed grid so every column lines up */
#list.list-card{padding:0}
.song-row{display:grid;grid-template-columns:24px 52px minmax(0,1fr) 16px 36px;align-items:center;column-gap:14px;width:100%;padding:8px 0;border-radius:14px;text-align:left;transition:background-color .2s}
.song-row:hover{background:#F6F6F7}
.sr-num{font-family:'Inter Tight',sans-serif;font-size:13px;font-weight:600;color:#A3A9B6;font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:center;height:16px}
.sr-text{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.sr-title{display:block;font-size:15.5px;font-weight:700;line-height:1.25;color:var(--ink)}

.sr-sub{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;line-height:1.25;color:var(--muted)}
.sr-sub .avatar{flex-shrink:0}
.sr-note{display:flex;justify-content:center;color:#A3A9B6}
.sr-dur{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

/* glass dock + mini player: content shows through, softly blurred */
nav.dock::before{display:none!important}
.dock-pill,.dock-add:not(.on),.mini{
  background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.56))!important;
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  border:1px solid rgba(255,255,255,.75)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 24px rgba(20,30,60,.07)!important}
.dock-item.on{background:color-mix(in srgb,var(--accent) 10%,transparent)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.dock-add.on{box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 28%,transparent)!important}

/* real black record */
.rec{position:relative;border-radius:50%}
.rec-disc{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle,transparent 0 20.5%,#0E0F12 20.5% 21.5%,transparent 21.5%),
    repeating-radial-gradient(circle,#18191D 0 2px,#1C1D22 2px 3.5px),
    #18191D;

.rec-label{position:relative;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.rec-sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 200deg,transparent 0deg,rgba(255,255,255,.13) 20deg,transparent 46deg,transparent 180deg,rgba(255,255,255,.09) 200deg,transparent 228deg)}
.rec-hole{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#F4F4F5;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tonearm{transform-origin:60px 56px;transform:rotate(-12deg)!important}
.phone.is-playing .tonearm{transform:rotate(13deg)!important}

/* ===== little note, written like a letter ===== */
.letter{margin-top:30px;padding:30px 22px 24px;border-radius:28px;background:#F3F3F6;text-align:center;color:#17181D;display:flex;flex-direction:column;align-items:center}
.doodle{color:var(--accent);transform:rotate(-4deg)}
.letter-count{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;color:var(--accent-dim)}
.letter-count b{font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 11px;border-radius:999px;font-family:'Inter Tight',sans-serif;font-size:13px}
.letter-body{margin-top:26px;font-family:'DM Mono',ui-monospace,monospace;font-size:14px;line-height:1.6;letter-spacing:.01em;max-width:290px}
.letter-body p{margin:0 0 16px}
.letter-accent{color:var(--accent);margin-bottom:0!important}
.letter-sign{margin-top:22px;font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-size:38px;line-height:1;color:var(--accent);display:flex;align-items:flex-start;gap:2px;transform:rotate(-3deg)}
.letter-sign svg{margin-top:-2px}
.letter-reply{margin-top:20px;font-family:'DM Mono',monospace;font-size:13px;line-height:1.5;color:#4A4E5C;max-width:290px}
.letter-reply span{display:block;font-size:11px;color:var(--accent-dim);margin-bottom:2px}
.letter .typing{margin-top:12px;font-family:'DM Mono',monospace}
.letter-btn{margin-top:24px;width:100%;max-width:300px;height:52px;border-radius:10px;background:var(--accent);color:#fff;font-family:'DM Mono',ui-monospace,monospace;font-size:14px;letter-spacing:.02em;text-align:center}
.letter-input{width:100%;max-width:300px;margin-top:22px;display:flex;flex-direction:column;gap:10px}
.letter-input input{height:48px;border:1px solid #DCDDE4;border-radius:10px;background:#fff;padding:0 14px;font-family:'DM Mono',monospace;font-size:14px;color:#17181D;outline:none;text-align:center}

.letter-input .letter-btn{margin-top:0}

/* glass avatar badge */
.pair-badge{padding:5px!important;border-radius:999px!important;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(240,242,248,.5))!important;
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  border:1px solid rgba(255,255,255,.85)!important;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.08)!important}

/* sticky glass headers */
.sticky-head{position:sticky;top:0;z-index:4;margin-top:calc(-48px - env(safe-area-inset-top));padding:calc(48px + env(safe-area-inset-top)) 0 10px;

.home-after-head{margin-top:4px}

.letter-all{margin-top:14px;font-family:'DM Mono',ui-monospace,monospace;font-size:13px;color:var(--accent);min-height:36px;padding:0 8px}
button.letter-count{min-height:36px}
.overlay.letters{z-index:30;background:#fff!important;padding:calc(14px + env(safe-area-inset-top)) 0 0;display:flex;flex-direction:column}
.letters-scroll{flex:1;overflow-y:auto;padding-bottom:18px;scrollbar-width:none}
.letters-scroll::-webkit-scrollbar{display:none}
.letters-title{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.03em}
.letters-list{display:flex;flex-direction:column;gap:14px;padding:22px 20px 0}
.lt{position:relative;background:#F3F3F6;border-radius:22px;padding:18px 18px 14px;max-width:88%;text-align:left}
.lt.k{align-self:flex-start;transform:rotate(-.6deg)}
.lt.a{align-self:flex-end;background:var(--accent-tint);transform:rotate(.6deg)}
.lt-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent-dim)}
.lt-re{font-family:'DM Mono',monospace;font-size:11px;color:#A3A9B6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-text{margin:8px 0 0;font-family:'DM Mono',monospace;font-size:14px;line-height:1.55;color:#17181D}
.lt-song{margin-top:10px;display:inline-flex;align-items:center;gap:8px;max-width:100%;height:34px;padding:0 10px 0 4px;border-radius:999px;background:#fff;font-size:12px;font-weight:600;color:var(--ink)}
.lt-sign{margin-top:8px;font-family:'Caveat','Segoe Print',cursive;font-size:24px;line-height:1;color:var(--accent);text-align:right}

.ask-card{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:22px;background:#F3F3F6}
.ask-ico{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.mini-track{position:absolute;left:18px;right:18px;bottom:5px;height:2.5px;border-radius:2px;background:rgba(20,30,60,.06);overflow:hidden}

.mini{overflow:hidden}

.steps{margin-top:32px;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:16px;align-items:start;padding:16px 0;border-top:1px solid #EFEFF2}
.step:first-child{border-top:0;padding-top:0}

.step-txt{padding-top:1px}
.step-h{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink)}
.step-p{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:4px}

.mini>div:first-child{padding:8px 8px 14px!important}
.mini-track{bottom:8px!important;left:20px!important;right:20px!important}

.rp-row .blue-sub{color:#8A8F9C!important}
.rp-row .blue-sub .eq i{background:var(--accent)}

/* serif headings */

  font-family:'Fraunces','Iowan Old Style','Georgia',serif!important;font-variation-settings:"opsz" 96;letter-spacing:-.02em!important}

.title,.sh-title{font-weight:600!important}

.np-title{font-weight:500!important;font-size:25px}
.step-h{font-weight:600!important;font-size:16px;letter-spacing:-.01em!important}

/* ===== onboarding ===== */
.ob-scroll{background:#fff}
.ob{min-height:100%;box-sizing:border-box;padding:calc(64px + env(safe-area-inset-top)) 28px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
.ob-center{align-items:center;text-align:center;justify-content:center}
.ob-back{position:absolute;left:12px;top:calc(14px + env(safe-area-inset-top));color:var(--ink)}
.ob-dots{display:flex;gap:6px;margin-bottom:26px}
.ob-center .ob-dots{justify-content:center}
.ob-dots span{width:22px;height:4px;border-radius:2px;background:#E6E7EC}
.ob-dots span.on{background:var(--accent)}
.ob-h{margin:0;font-family:'Fraunces','Instrument Serif','Georgia',serif;font-weight:600;font-size:clamp(30px,8.6vw,36px);line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
.ob-p{margin:14px auto 0;max-width:310px;font-size:15px;line-height:1.55;color:var(--muted)}

.ob-actions{width:100%;max-width:340px;margin-top:40px;display:flex;flex-direction:column;gap:10px}

.ob-field input{height:52px;border:1px solid #E1E3E8;border-radius:14px;padding:0 16px;font-size:16px;color:var(--ink);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.ob-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.ob-field input.code-input{font-family:'DM Mono',ui-monospace,monospace;font-size:20px;letter-spacing:.12em;text-align:center}
.ob-btn{height:54px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-align:center;width:100%}
.ob-btn[disabled]{opacity:.6}
.ob-btn.ghost{background:var(--accent-tint);color:var(--accent)}
.ob-btn.small{height:44px;font-size:14px;border-radius:12px}

.ob-fine{margin:2px 0 0;font-size:12px;color:#A3A9B6;text-align:center}

.ob-search{height:48px;border:1px solid #E1E3E8;border-radius:14px;padding:0 16px;font-size:15px;outline:none;color:var(--ink)}

.ob-cities{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ob-chip{height:38px;padding:0 15px;border-radius:999px;background:#F3F3F6;font-size:14px;font-weight:600;color:var(--ink)}
.ob-chip:hover{background:var(--accent-tint);color:var(--accent)}
.ob > .ob-btn{margin-top:24px}
.dist-art{position:relative;height:84px;margin:4px 0 22px;color:#C5CAD6;display:flex;align-items:flex-end;justify-content:center}
.dist-art svg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%)}
.pin{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:16px;flex-shrink:0}
.pin.a{background:var(--accent-tint);color:var(--accent)}
.pin.b{background:#FFE6D6;color:#9A4A1E}
.dist-art .pin{position:absolute;bottom:0}

.code-card{margin-top:26px;width:100%;max-width:330px;padding:18px;border-radius:22px;background:#F3F3F6}
.code{margin-top:6px;font-family:'DM Mono',ui-monospace,monospace;font-size:30px;letter-spacing:.14em;color:var(--accent)}
.code-link{font-family:'DM Mono',monospace;font-size:12px;color:#8A90A0;margin-top:2px}
.km-big{display:inline-block;margin:10px 0 4px;font-family:'Fraunces','Georgia',serif;font-size:26px;font-weight:600;color:var(--accent)}
.prof-rows{margin:20px 0 14px;display:flex;flex-direction:column}
.prof-rows div{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-top:1px solid #EFEFF2;font-size:14px}

.prof-rows b{font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* typing on a phone: the keyboard covers the bottom, so the nav + mini player stay down there instead of riding up */
@media (pointer:coarse){
  .field-focus .dock,.field-focus .mini,.kb-open .dock,.kb-open .mini{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(24px);transition:opacity .15s,transform .15s,visibility 0s .15s}
}
.dock,.mini{transition:opacity .2s,transform .2s}

/* ===== colour themes ===== */
:root{--accent:#2149E8;--accent-ink:#1E3FC8;--accent-mid:#4A67E0;--accent-tint:#EEF1FF;--accent-dim:#8E9BD0;--art-filter:none;
  --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);--accent-shadow:color-mix(in srgb,var(--accent) 30%,transparent);--blue-sub:var(--accent-mid);--lav-mid:var(--accent-mid)}
.art2 img{filter:var(--art-filter)}
.theme-card{margin:18px 0 12px;padding:16px 14px 14px;border-radius:20px;background:#F6F6F8}
.theme-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.theme-t{font-size:15px;font-weight:700;color:var(--ink)}
.theme-s{font-size:12px;color:var(--muted);margin-top:2px}
.theme-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:#fff;font-size:12.5px;font-weight:600;color:var(--accent);flex-shrink:0}
.theme-pill i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.theme-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.theme-sw{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;min-width:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.theme-sw[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--c)}
.theme-lbl{font-size:14px;font-weight:600;color:var(--ink)}
.theme-sw[aria-pressed="true"]{z-index:1}
.theme-sw .rec{position:relative;width:28px;height:28px;flex-shrink:0;border-radius:50%;background:repeating-radial-gradient(circle,#FAFAFB 0 1.5px,#E4E6EB 1.5px 2.5px);box-shadow:0 0 0 1px #E3E5EA,0 3px 8px rgba(20,30,60,.08);transition:box-shadow .25s,transform .25s}
.theme-sw .lbl{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);transition:width .25s,height .25s}
.theme-sw .hole{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.theme-sw[aria-pressed="true"] .rec{box-shadow:0 0 0 2px #F6F6F8,0 0 0 4px var(--c),0 6px 14px rgba(20,30,60,.14);transform:scale(1.06);animation:spin 6s linear infinite}
.theme-sw[aria-pressed="true"] .lbl{width:58%;height:58%}
.theme-sw:active .rec{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){.theme-sw[aria-pressed="true"] .rec{animation:none}}

/* solo mode */
.pair-empty{background:#fff!important;color:var(--accent)!important;border:1.5px dashed var(--accent-dim)!important;font-weight:600;box-sizing:border-box}
.pin.empty{background:#fff;color:var(--accent);border:1.5px dashed var(--accent-dim);box-sizing:border-box}
.inv-dash{width:34px;height:0;border-top:1.5px dashed var(--accent-dim)}
.inv-hero{border-radius:26px;padding:22px 20px 20px;background:var(--accent-tint);text-align:center;display:flex;flex-direction:column;align-items:center}
.inv-pair{display:flex;align-items:center;gap:8px}
.inv-hero .pin.a{background:#fff}
.inv-t{margin-top:14px;font-family:'Fraunces','Georgia',serif;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.inv-p{margin:6px 0 0;max-width:290px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.inv-p b{color:var(--accent);font-family:'DM Mono',monospace;font-weight:500}
.inv-actions{display:flex;gap:8px;margin-top:16px;width:100%;max-width:300px}
.inv-actions .ob-btn{flex:1}
.inv-actions .ob-btn.ghost{background:#fff}
.inv-sheet{overflow-y:auto;scrollbar-width:none}
.inv-sheet-foot{display:flex;flex-direction:column;gap:6px;margin-top:20px}

/* swipe-to-delete rows */
.sw-row{position:relative;overflow:hidden;border-radius:14px;touch-action:pan-y;transition:height .26s ease,opacity .26s ease}
.sw-row .song-row{position:relative;z-index:1;background:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.sw-del{position:absolute;right:0;top:4px;bottom:4px;width:84px;border-radius:14px;background:#E5484D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;opacity:0;transition:opacity .2s}
.sw-row.open .sw-del,.sw-row:has(.song-row[style*="translateX"]) .sw-del{opacity:1}
.sw-row.removing{opacity:0}
.undo-bar{position:absolute;left:16px;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(20,20,30,.25);animation:toastUp .28s cubic-bezier(.2,.8,.2,1) both}
.undo-bar span{flex:1;min-width:0}
.undo-bar button{height:36px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:700}
.undo-bar.out{opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
@keyframes toastUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== launch splash =====
   all white, so it carries straight on from the phone's own white launch screen */
#splash{position:fixed;inset:0;z-index:999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .5s cubic-bezier(.4,0,.2,1);will-change:opacity}
#splash.out{opacity:0;pointer-events:none}
#splash.out .sp-inner{transform:translateY(-10px) scale(.98);transition:transform .5s cubic-bezier(.4,0,.2,1)}
.sp-inner{position:relative;display:flex;flex-direction:column;align-items:center;will-change:transform}
.sp-logo{font-family:'Yellowtail','Pacifico',cursive;font-size:56px;line-height:1;color:var(--accent);display:flex;align-items:baseline;transform:scale(var(--s0,1));will-change:transform}
#splash.go .sp-logo{animation:spShrink .8s cubic-bezier(.22,1,.36,1) .08s forwards}
@keyframes spShrink{to{transform:scale(1)}}
.sp-dot{display:inline-block;will-change:transform}
.sp-buds{position:absolute;bottom:calc(100% + 12px);left:50%;height:138px;margin-left:-46px;opacity:0;transform:translateY(-36px);will-change:transform,opacity}
.sp-buds .buds{display:block;overflow:visible}
#splash .buds{color:#17181D!important}
.sp-tag{position:absolute;top:calc(100% + 12px);left:50%;transform:translate(-50%,6px);white-space:nowrap;font-family:'Inter Tight','Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;font-weight:500;letter-spacing:.08em;color:#8A90A0;opacity:0}
#splash.go .sp-buds{animation:spDrop .9s cubic-bezier(.22,1,.36,1) .4s forwards}
#splash.go .sp-dot{animation:spBob .42s cubic-bezier(.45,0,.55,1) 1s 2 alternate}
#splash.go .sp-dot:nth-of-type(3){animation-delay:1.12s}
#splash.go .sp-tag{animation:spTag .6s cubic-bezier(.22,1,.36,1) 1.1s forwards}
@keyframes spDrop{to{opacity:1;transform:none}}
@keyframes spBob{to{transform:translateY(-7px)}}
@keyframes spTag{to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){
  #splash.go .sp-buds{animation:none;opacity:1;transform:none}
  #splash.go .sp-tag{animation:none;opacity:1;transform:translate(-50%,0)}
  #splash.go .sp-dot{animation:none}
  .sp-logo,#splash.go .sp-logo{transform:none;animation:none}
}



.lib-empty{padding:40px 28px 48px;text-align:center;display:flex;flex-direction:column;align-items:center}
.lib-empty-t{margin-top:12px;font-family:'Fraunces','Georgia',serif;font-size:22px;font-weight:600;color:var(--ink)}
.lib-empty p{margin:6px 0 18px;max-width:260px;font-size:13.5px;line-height:1.5;color:var(--muted)}

.del-link{color:#B4342D!important;margin-top:2px}
.del-card{margin-top:10px;padding:16px;border-radius:18px;background:#FFF4F3;text-align:left}
.del-t{font-size:15px;font-weight:700;color:#8F2A24}
.del-card p{margin:6px 0 14px;font-size:13px;line-height:1.5;color:#7A4A46}
.del-actions{display:flex;gap:8px}.del-actions .ob-btn{flex:1}
.del-yes{background:#D93B35!important;color:#fff!important}
.ob-btn[disabled]{opacity:.65}

/* ===== library: Songs | Playlists ===== */
.lib-seg{display:flex;gap:6px;margin-top:14px}
.lib-seg button{height:38px;padding:0 16px;border-radius:999px;background:#F1F1F4;color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.lib-seg button span{font-size:12px;opacity:.7}
.lib-seg button.on{background:var(--ink);color:#fff}
.pl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;margin-top:18px}
.pl-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-width:0}
.pl-card b{margin-top:8px;font-size:15px;font-weight:700;color:var(--ink);max-width:100%}
.pl-card span:not(.pl-art):not(.pl-art *){font-size:12.5px;color:var(--muted)}
.pl-art{display:inline-grid;border-radius:16px;overflow:hidden;background:#F1F1F4;flex-shrink:0;box-shadow:0 8px 20px rgba(20,30,60,.08)}
.pl-art.grid{grid-template-columns:1fr 1fr}
.pl-art > *{border-radius:0!important}
.pl-art.empty{display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-tint);box-shadow:none}
.pl-card.new .pl-art.empty{border:1.5px dashed var(--accent-dim);background:#fff}
.pl-detail-head{padding-top:10px}
.pl-back{display:inline-flex;align-items:center;gap:4px;height:36px;margin-left:-6px;font-size:14px;font-weight:600;color:var(--accent)}
.pl-hero{display:flex;gap:16px;align-items:flex-end;margin-top:10px}
.pl-name{margin:0;font-family:'Fraunces','Georgia',serif;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1;color:var(--ink);overflow-wrap:anywhere}
.pl-actions{display:flex;gap:8px;margin-top:12px;align-items:center}
.pl-play{height:40px;padding:0 18px;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.pl-play[disabled]{opacity:.45}
.pl-icon{width:40px;height:40px;border-radius:50%;background:#F1F1F4;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pl-sheet{max-height:82%!important;overflow-y:auto;scrollbar-width:none}
.pl-done{height:36px;padding:0 14px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-size:14px;font-weight:700;flex-shrink:0}
.pick-list{display:flex;flex-direction:column;margin-top:12px}
.pick-row{display:flex;align-items:center;gap:12px;padding:8px 2px;text-align:left;border-radius:12px}
.pick-check{width:26px;height:26px;border-radius:50%;border:1.5px solid #D5D8E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;transition:background .15s,border-color .15s}
.pick-row.on .pick-check{background:var(--accent);border-color:var(--accent)}
.menu-list{display:flex;flex-direction:column;margin-top:10px}
.menu-list button{display:flex;align-items:center;gap:12px;height:52px;font-size:15px;font-weight:600;color:var(--ink);border-top:1px solid #EFEFF2;text-align:left}
.menu-list button.danger{color:#C2362F}
/* swipe actions */
.sw-acts{position:absolute;right:0;top:4px;bottom:4px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.sw-row.open .sw-acts,.sw-row:has(.song-row[style*="translateX"]) .sw-acts{opacity:1}
.sw-act{width:84px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700}
.sw-acts .sw-del{position:static;opacity:1;width:84px}
.sw-act.pl{background:var(--accent)}
.sw-act.rm{background:#8A90A0}
/* find a song */
.add-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:18px;padding:4px;border-radius:16px;background:#F1F1F4}
.add-seg button{height:42px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.add-seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(20,30,60,.08)}
.find-box{padding-right:6px}
.find-box input{min-width:0}
.find-go{height:36px;padding:0 14px;border-radius:12px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;flex-shrink:0}
.find-hint{margin:10px 2px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.find-hint b{color:var(--ink);font-weight:600}
.find-list{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.find-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.find-th{width:72px;height:54px;border-radius:12px;overflow:hidden;background:#EEF0F4;flex-shrink:0}
.find-th img{width:100%;height:100%;object-fit:cover;display:block}
.find-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.find-tx b{font-size:14.5px;font-weight:700;color:var(--ink)}
.find-tx span{font-size:12.5px;color:var(--muted)}
.find-add{width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.find-empty{padding:28px 8px;text-align:center;font-size:13.5px;color:var(--muted)}
.find-row.skel .find-th,.find-row.skel i{background:linear-gradient(90deg,#EEF0F4,#F7F8FA,#EEF0F4);background-size:200% 100%;animation:skel 1.2s linear infinite}
.find-row.skel i{display:block;height:11px;border-radius:6px;width:70%}.find-row.skel i+i{width:45%}
@keyframes skel{to{background-position:-200% 0}}
/* YouTube player window */
.ses-stage .has-pip .pad{padding-bottom:300px!important}
.pl-actions{flex-wrap:nowrap}.pl-hero > div{flex:1}
@media (max-width:360px){.pl-play{padding:0 14px}.pl-icon{width:36px;height:36px}}
.inline-link{display:inline;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;min-height:0}

/* ===== profile sheet ===== */
.prof-sheet{background:#F6F6F8!important;overflow-y:auto;scrollbar-width:none;padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}
.prof-head{display:flex;flex-direction:column;align-items:center}
.prof-head .pin.a{background:#fff}
.prof-names{margin-top:12px;font-family:'Fraunces','Georgia',serif;font-size:26px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-align:center}
.prof-names i{font-style:normal;color:var(--accent)}
.prof-dist{margin-top:18px;padding:18px 16px 14px;border-radius:22px;background:#fff;text-align:center}
.pd-km{font-family:'Fraunces','Georgia',serif;font-size:40px;font-weight:600;line-height:1;color:var(--accent);letter-spacing:-.02em}
.pd-km span{font-size:18px}
.pd-label{margin-top:6px;font-size:13px;color:var(--muted)}
.pd-cities{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;gap:6px;margin-top:16px}
.pd-city{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pd-city .pin{width:34px;height:34px;font-size:14px}
.pd-city b{font-size:14px;font-weight:700;color:var(--ink);max-width:100%}
.pd-city small{font-size:12px;color:var(--muted)}
.pd-line{width:64px;height:20px;color:var(--accent-dim);margin-bottom:28px}
.pd-update{margin-top:14px;height:36px;padding:0 14px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pg-title{margin:22px 4px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A90A0}
.prof-sheet .theme-row{margin-top:0}
.pg-hint{margin:8px 4px 0;font-size:12px;line-height:1.45;color:#8A90A0}
.pg-card{border-radius:18px;background:#fff;overflow:hidden}
.pg-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;font-size:15px;font-weight:600;color:var(--ink);text-align:left;border-top:1px solid #F0F0F3}
.pg-row:first-child{border-top:0}
.pg-row.static span{color:var(--muted);font-weight:500;flex-shrink:0}
.pg-row.static b{font-size:14px;font-weight:600;min-width:0}
.pg-row svg{color:#B8BCC6;flex-shrink:0}
.pg-row.danger{color:#C2362F}
.prof-sheet .del-card{background:#fff}
/* ===== streamed songs show only their cover ===== */
.ses-stage .add-seg{margin-top:18px}

.batch-card{margin-top:22px;padding:22px 20px;border-radius:22px;background:#fff;box-shadow:0 10px 26px rgba(20,30,60,.06);text-align:center}
.batch-n{font-family:'Fraunces','Georgia',serif;font-size:40px;font-weight:600;color:var(--accent);line-height:1}
.batch-n span{font-size:18px;color:var(--muted)}
.batch-now{margin-top:8px;font-size:14px;font-weight:600;color:var(--ink)}
.batch-bar{margin-top:16px;height:6px;border-radius:3px;background:#ECEDF1;overflow:hidden}
.batch-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.batch-card p{margin:14px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.share-tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--accent-tint);color:var(--accent);font-size:13px;line-height:1.45}
.share-tip svg{flex-shrink:0;margin-top:1px}
.share-tip span{color:var(--ink)}
.prof-sheet .theme-sw{padding:10px 12px;gap:10px}
.theme-sw[aria-pressed="true"] .rec{box-shadow:0 0 0 1px #E3E5EA,0 3px 8px rgba(20,30,60,.08)!important;transform:none!important}
.theme-sw .lbl{width:50%;height:50%}.theme-sw[aria-pressed="true"] .lbl{width:56%;height:56%}

/* ===== profile sheet: everything visible, scrolls when needed ===== */
.prof-sheet{max-height:calc(100% - 28px)!important;display:block!important;overflow-y:auto!important;overscroll-behavior:contain}
.prof-sheet > *{flex-shrink:0}
.prof-sheet .pg-card{margin-bottom:6px}
.pg-row{transition:background-color .15s}
.pg-row:active{background:#F4F5F7}
/* micro-animations */
.prof-sheet.sheetUp > *:not(:first-child){animation:pfIn .5s cubic-bezier(.2,.8,.2,1) both}
.prof-sheet.sheetUp > *:nth-child(2){animation-delay:.06s}.prof-sheet.sheetUp > *:nth-child(3){animation-delay:.11s}
.prof-sheet.sheetUp > *:nth-child(4){animation-delay:.16s}.prof-sheet.sheetUp > *:nth-child(5){animation-delay:.2s}
.prof-sheet.sheetUp > *:nth-child(6){animation-delay:.24s}.prof-sheet.sheetUp > *:nth-child(7){animation-delay:.28s}.prof-sheet.sheetUp > *:nth-child(8){animation-delay:.32s}
@keyframes pfIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.prof-head .joined-heart{animation:beat 1.4s ease-in-out infinite}
.prof-sheet.sheetUp .pd-line path{stroke-dashoffset:0;animation:pdDraw 1.1s ease .35s both}
@keyframes pdDraw{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.pd-line{transform-origin:left center}
.theme-sw{transition:box-shadow .2s,transform .15s}
.theme-sw:active{transform:scale(.97)}
.theme-sw[aria-pressed="true"] .lbl{animation:swPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes swPop{from{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(-50%,-50%) scale(1)}}
.pd-update{transition:transform .15s,background-color .2s}.pd-update:active{transform:scale(.96)}
/* confirmation pop-up */
.dlg-wrap{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg-backdrop{position:absolute;inset:0;background:rgba(15,17,24,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .2s ease both}
.dlg{position:relative;width:100%;max-width:330px;border-radius:24px;background:#fff;padding:24px 20px 18px;text-align:center;box-shadow:0 30px 60px rgba(15,17,24,.3);animation:dlgIn .32s cubic-bezier(.2,1.2,.3,1) both}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
.dlg-ico{width:56px;height:56px;margin:0 auto;border-radius:50%;background:#FFF1F0;color:#D93B35;display:flex;align-items:center;justify-content:center;animation:dlgShake .5s ease .25s both}
@keyframes dlgShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
.dlg h2{margin:14px 0 0;font-family:'Fraunces','Georgia',serif;font-size:20px;font-weight:600;line-height:1.25;color:var(--ink)}
.dlg p{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.dlg-btn{height:48px;border-radius:14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.dlg-btn:active{transform:scale(.97)}
.dlg-btn.ghost{background:#F2F3F5;color:var(--ink)}
.dlg-btn.danger{background:#D93B35;color:#fff}
.dlg-btn.accent{background:var(--accent);color:#fff}
.dlg-ico.soft{background:var(--accent-soft,#EEF2FF);color:var(--accent);animation:dlgIn .4s cubic-bezier(.2,1.2,.3,1) .1s both}
.dlg-input{width:100%;height:50px;margin-top:16px;border-radius:14px;border:1.5px solid #E3E4E8;background:#F7F8FA;padding:0 16px;font:600 17px 'Inter Tight','Inter',sans-serif;color:var(--ink);text-align:center;outline:none;transition:border-color .15s,background .15s}
.dlg-input:focus{border-color:var(--accent);background:#fff}
.prof-rename{margin:10px auto 0;display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:#F2F3F5;color:var(--muted);font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd-wrap{position:absolute;inset:0;z-index:80;display:flex;align-items:flex-end}
.upd-backdrop{position:absolute;inset:0;background:rgba(15,17,24,.42)}
.upd-sheet{position:relative;width:100%;background:#fff;border-radius:32px 32px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));text-align:center;box-shadow:0 -20px 50px rgba(15,17,24,.18)}
.upd-x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.upd-doodle{display:block;width:200px;height:155px;margin:14px auto 0;overflow:visible;color:#17181D}
.upd-sheet h2{margin:14px auto 0;max-width:290px;font-family:'Fraunces','Georgia',serif;font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.upd-sheet p{margin:10px auto 0;max-width:280px;font-size:14.5px;line-height:1.5;color:var(--muted)}
.upd-go{margin-top:24px;width:100%;height:54px;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px var(--accent-shadow)}
.upd-go[disabled]{opacity:.8}
.upd-wrap.in .upd-backdrop{animation:fadeIn .25s ease both}
.upd-wrap.in .upd-sheet{animation:updUp .5s cubic-bezier(.2,1.1,.3,1) both}
.upd-wrap.in .upd-doodle{animation:updPop .6s cubic-bezier(.2,1.4,.3,1) .15s both}
.upd-wrap.in .upd-sheet h2{animation:updRise .45s ease .25s both}
.upd-wrap.in .upd-sheet p{animation:updRise .45s ease .32s both}
.upd-wrap.in .upd-go{animation:updRise .45s ease .4s both}
.ud-phone{transform-box:fill-box;transform-origin:50% 90%;animation:udWiggle 3.2s ease-in-out infinite}
.ud-note{transform-box:fill-box;transform-origin:50% 100%;animation:udFloat 2.6s ease-in-out infinite}
.ud-arrow{animation:udDrop 1.6s ease-in-out infinite}
.ud-spark path{transform-box:fill-box;transform-origin:center;animation:udTwinkle 1.8s ease-in-out infinite}
.ud-spark path:nth-child(2){animation-delay:.9s}
.ud-swish{animation:udSwish 2.6s ease-in-out infinite}
@keyframes updUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes updPop{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes updRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes udWiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-2deg)}}
@keyframes udFloat{0%,100%{transform:translateY(0) rotate(4deg)}50%{transform:translateY(-9px) rotate(-5deg)}}
@keyframes udDrop{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes udTwinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes udSwish{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.upd-wrap *{animation:none!important}}
.pg-val{font-weight:600;color:var(--accent);font-size:14px}
.prof-rename svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lt-compose{display:flex;align-items:center;gap:8px;margin:0 14px;padding:8px 6px calc(10px + env(safe-area-inset-bottom)) 16px;border-top:1px dashed #E3E0D6;background:#fff}
.lt-compose input{flex:1;min-width:0;height:46px;border:0;outline:none;background:transparent;font-family:'DM Mono',monospace;font-size:15px;color:#17181D}
.lt-compose input::placeholder{color:#A3A9B6}
.lt-compose button{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#E9EAEE;color:#fff;transition:background .2s,transform .2s}
.lt-compose button.on{background:var(--accent);transform:scale(1.04)}
.lt-empty{text-align:center;color:var(--muted);font-size:14px;margin:30px 0}
.dlg-btn[disabled]{opacity:.7}
.dlg-spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@media (prefers-reduced-motion:reduce){.prof-sheet.sheetUp > *,.dlg,.dlg-ico,.prof-head .joined-heart{animation:none!important}}

  var sp = document.getElementById('splash'), done = false;

  function fit() { var l = sp.querySelector('.sp-logo'); if (!l || reduce) return; var w = l.offsetWidth || 160; sp.style.setProperty('--s0', Math.min(2.6, Math.max(1, innerWidth * 0.42 / w)).toFixed(3)); }
  fit();
  function go() { if (sp.classList.contains('go')) return; fit(); sp.classList.add('go'); setTimeout(hide, reduce ? 700 : 2100); }
  function hide() { if (done) return; done = true; sp.classList.add('out'); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#ffffff'); setTimeout(function () { sp.remove(); }, 520); }
  sp.addEventListener('click', hide);
  try { document.fonts.load('40px Yellowtail').then(go, go); } catch (e) { go(); }

})();

<script>
/* ================= DATA ================= */
const SONGS = [];   // your library comes from the cloud
const ME = { name:'Aanya', ini:'A', col:'var(--accent-tint)', tc:'var(--accent)' };
const P  = { name:'Kabir', ini:'K', col:'#FFE6D6', tc:'#9A4A1E', city:'London', tz:'Europe/London', km:'6,710 km' };
const kmLine = () => P.km ? (/km$/.test(P.km) ? P.km + ' apart' : P.km.toLowerCase()) : null;

/* ================= ACCOUNT, LOCATION & INVITE (onboarding) ================= */
const CITIES = [
  { n: 'Delhi', lat: 28.6139, lon: 77.2090, tz: 'Asia/Kolkata' },
  { n: 'Mumbai', lat: 19.0760, lon: 72.8777, tz: 'Asia/Kolkata' },
  { n: 'Bengaluru', lat: 12.9716, lon: 77.5946, tz: 'Asia/Kolkata' },
  { n: 'Kolkata', lat: 22.5726, lon: 88.3639, tz: 'Asia/Kolkata' },
  { n: 'Pune', lat: 18.5204, lon: 73.8567, tz: 'Asia/Kolkata' },
  { n: 'London', lat: 51.5072, lon: -0.1276, tz: 'Europe/London' },
  { n: 'New York', lat: 40.7128, lon: -74.0060, tz: 'America/New_York' },
  { n: 'Toronto', lat: 43.6532, lon: -79.3832, tz: 'America/Toronto' },
  { n: 'Dubai', lat: 25.2048, lon: 55.2708, tz: 'Asia/Dubai' },
  { n: 'Singapore', lat: 1.3521, lon: 103.8198, tz: 'Asia/Singapore' },
  { n: 'Sydney', lat: -33.8688, lon: 151.2093, tz: 'Australia/Sydney' },
  { n: 'Berlin', lat: 52.52, lon: 13.405, tz: 'Europe/Berlin' }
];
const PARTNER_HOME = { city: 'London', lat: 51.5072, lon: -0.1276, tz: 'Europe/London' };   // where the invited person is in this prototype
const ACCOUNT_KEY = 'hum_account_v1';
const acct = {
  load() { try { return JSON.parse(localStorage.getItem(ACCOUNT_KEY) || 'null'); } catch (e) { return null; } },
  save(a) { try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(a)); } catch (e) {} },
  clear() { try { localStorage.removeItem(ACCOUNT_KEY); } catch (e) {} }
};
function kmBetween(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
function nearestCity(lat, lon) {
  let best = null, bd = 1e9;
  CITIES.forEach(c => { const d = kmBetween({ lat, lon }, c); if (d < bd) { bd = d; best = c; } });
  return bd < 80 ? best.n : null;
}
const initials = n => (n || '?').trim().charAt(0).toUpperCase();
const inviteCode = () => 'HUM-' + Math.random().toString(36).slice(2, 6).toUpperCase();

/* apply a saved/finished account to the people the app shows */
const capName = n => (n || '').trim().replace(/^\p{Ll}/u, c => c.toUpperCase());
const PAIR = { state: 'none', name: '', code: '', real: false };
const validTz = tz => { if (!tz) return false; try { new Intl.DateTimeFormat('en', { timeZone: tz }); return true; } catch (e) { return false; } };
const simulate = () => !PAIR.real;   // pretend partner activity only for the old demo pairing   // none | pending | paired
const paired = () => PAIR.state === 'paired';
function applyAccount(a) {
  ME.name = capName(a.me.name); ME.ini = initials(a.me.name);
  const pp = a.partner;
  PAIR.state = pp ? (pp.accepted ? 'paired' : 'pending') : 'none';
  PAIR.name = pp ? pp.name : ''; PAIR.code = pp ? pp.code : '';
  if (!pp || !pp.accepted) { P.name = pp ? pp.name : 'your person'; P.ini = pp ? initials(pp.name) : '+'; }
  if (a.partner && a.partner.accepted) {
    P.name = capName(a.partner.name); P.ini = initials(a.partner.name);
    P.city = a.partner.city || ''; P.tz = validTz(a.partner.tz) ? a.partner.tz : 'UTC';
  }
  PAIR.real = !!(a.partner && a.partner.real);
  if (a.me.loc && a.partner && a.partner.accepted && a.partner.lat != null && a.partner.lon != null) {
    const km = kmBetween(a.me.loc, a.partner);
    P.km = km < 1 ? 'Right next to each other' : km.toLocaleString('en-IN') + ' km';
  } else P.km = null;
}

const OB = { step: null, form: {}, err: '', code: '', locBusy: false, cityQ: '' };
/* ----- real invites without a server: the link itself carries who sent it ----- */
const APP_URL = () => /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/index\.html$/, '') : 'https://humm-amber.vercel.app/';
const myTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } };
const meParams = a => { const l = a.me.loc || {}; const e = encodeURIComponent; return `n=${e(a.me.name)}&c=${e(l.city || '')}&la=${l.lat != null ? (+l.lat).toFixed(3) : ''}&lo=${l.lon != null ? (+l.lon).toFixed(3) : ''}&tz=${e(myTz())}`; };
const inviteLink = a => `${APP_URL()}?join=${a.partner.code}`;
const acceptLink = a => `${APP_URL()}?accept=${a.partner.code}&${meParams(a)}`;
const shortLink = code => APP_URL().replace(/^https?:\/\//, '') + '?join=' + code;
const inviteText = a => `${a.me.name} invited you to humm.. ♡ music for two. Tap to join: ${inviteLink(a)}  (code ${a.partner.code})`;
const acceptText = a => `I'm in on humm.. ♡ Tap this so we're connected: ${acceptLink(a)}`;
function waNumber(contact) {
  const d = (contact || '').replace(/[^\d+]/g, ''); if (!d) return null;
  if (d.startsWith('+')) return d.slice(1);
  if (d.length === 10) return '91' + d;                 // a 10-digit Indian mobile
  if (d.length === 11 && d.startsWith('0')) return '91' + d.slice(1);
  return d.length >= 10 ? d : null;
}
function openOut(url) { const w = window.open(url, '_blank'); if (!w) location.href = url; }
function sendInviteTo(a) {   // WhatsApp for a phone number, email for an email; otherwise the share sheet
  const contact = (a.partner.contact || '').trim(), text = inviteText(a);
  if (/^\S+@\S+\.\S+$/.test(contact)) return openOut(`mailto:${encodeURIComponent(contact)}?subject=${encodeURIComponent(a.me.name + ' invited you to humm..')}&body=${encodeURIComponent(text)}`);
  const n = waNumber(contact); if (n) return openOut(`https://wa.me/${n}?text=${encodeURIComponent(text)}`);
  shareText(text);
}
async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ title: 'humm..', text }); return; } } catch (e) { return; }
  openOut(`https://wa.me/?text=${encodeURIComponent(text)}`);
}
const fromUrl = (() => {
  const q = new URLSearchParams(location.search), join = q.get('join'), accept = q.get('accept');
  if (!join && !accept) return null;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  const num = v => { const x = parseFloat(v); return isFinite(x) ? x : null; };
  return { join: join && join.toUpperCase(), accept: accept && accept.toUpperCase(), who: { name: (q.get('n') || '').slice(0, 40), city: (q.get('c') || '').slice(0, 60), lat: num(q.get('la')), lon: num(q.get('lo')), tz: q.get('tz') || '' } };
})();
(function boot() {
  const a = acct.load();
  if (a && a.me && a.me.loc && ((a.partner && a.partner.accepted) || a.solo)) { applyAccount(a); return; }
  OB.step = a && a.me ? (a.me.loc ? (a.partner ? 'waiting' : 'invite') : 'location') : 'welcome';
  OB.acc = a || null;
  if (a && a.partner) OB.code = a.partner.code;
})();
const onboarding = () => !!OB.step;

const flower = (w = 64) => `<svg class="doodle buds" width="${w}" height="${Math.round(w * 1.5)}" viewBox="0 0 100 150" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<g class="sway sway-l">
  <path d="M38 0c1 14-3 24-4 36s5 22 3 34-6 18-4 30c1 6 2 10 2 14"/>
  <g transform="rotate(8 35 120)">
    <rect x="31" y="112" width="8" height="12" rx="2.5" fill="#fff"/>
    <path d="M33 116v4"/>
    <path d="M30 124c-3 3-6 7-7 12-1 6 3 10 8 10 6 0 9-5 8-11-1-5-4-8-9-11z" fill="#fff"/>
    <ellipse cx="31" cy="138" rx="4.6" ry="6.4" transform="rotate(-14 31 138)"/>
  </g>
  </g>
  <g class="sway sway-r">
  <path d="M60 0c-2 12 3 22 2 34s-6 22-4 34 6 18 3 30c-1 6-2 10-2 15"/>
  <g transform="rotate(-8 59 121)">
    <rect x="55" y="113" width="8" height="12" rx="2.5" fill="#fff"/>
    <path d="M59 117v4"/>
    <path d="M62 125c3 3 6 7 7 12 1 6-3 10-8 10-6 0-9-5-8-11 1-5 4-8 9-11z" fill="#fff"/>
    <ellipse cx="62" cy="139" rx="4.6" ry="6.4" transform="rotate(14 62 139)"/>
  </g>
  </g>
</svg>`;
const threadLink = (w = 64, cls = '') => `<svg class="tlink ${cls}" width="${w}" height="${Math.round(w * .45)}" viewBox="0 0 80 36" fill="none" aria-hidden="true">
  <path class="tl-path" pathLength="1" d="M2 12C14 20 26 27 40 29C33 25 30 19 33 16C35 14 39 15 40 18.5C41 15 45 14 47 16C50 19 47 25 40 29C54 27 66 20 78 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
const obDots = n => `<div class="ob-dots" aria-label="Step ${n} of 3">${[1, 2, 3].map(i => `<span class="${i <= n ? 'on' : ''}"></span>`).join('')}</div>`;
const obBack = to => `<button class="icon-btn press ob-back" data-act="ob" data-to="${to}" aria-label="Back">${svg(22, '<path d="m15 6-6 6 6 6"/>')}</button>`;
const icoEye = () => svg(20, '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'), icoEyeOff = () => svg(20, '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>', 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"');
const field = (id, label, type, ph, val, extra = '') => {
  const input = t => `<input id="${id}" type="${t}" placeholder="${ph}" value="${esc(val || '')}" autocomplete="${extra || 'off'}">`;
  if (type !== 'password') return `<label class="ob-field"><span>${label}</span>${input(type)}</label>`;
  const show = !!OB.showPw;
  return `<div class="ob-field"><label for="${id}"><span style="font-size:13px;font-weight:600;color:var(--ink)">${label}</span></label>
    <span class="pw-wrap">${input(show ? 'text' : 'password')}
    <button type="button" class="press pw-eye" data-act="togglepw" data-for="${id}" aria-label="${show ? 'Hide' : 'Show'} password" aria-pressed="${show}">${show ? icoEyeOff() : icoEye()}</button></span></div>`;
};

function onboardView() {
  const f = OB.form, a = OB.acc;
  const err = OB.err ? `<div class="ob-err" role="alert">${esc(OB.err)}</div>` : '';
  switch (OB.step) {
    case 'welcome': return `<div class="ob ob-center">
      <div class="logo" aria-label="humm" style="font-size:46px;transform:none">humm<span class="logo-dots">..</span></div>
      <div style="color:var(--accent);margin-top:26px">${flower(124)}</div>
      <h1 class="ob-h" style="margin-top:18px">Music for two,<br>wherever you are</h1>
      <p class="ob-p">Listen to the same song at the same time, leave little notes, and always know how far apart you are.</p>
      <div class="ob-foot">
        <button class="press ob-btn" data-act="ob" data-to="signup">Create an account</button>
        <button class="press ob-btn ghost" data-act="ob" data-to="join">I have an invite code</button>
        <button class="press ob-link" data-act="ob" data-to="login">Already have an account? <b>Log in</b></button>
        ${CLOUD.sb && CLOUD.sb.demo ? '<p class="ob-fine" style="margin-top:2px">Preview mode: accounts and songs stay on this phone</p>' : ''}
      </div>
    </div>`;
    case 'signup': return `<div class="ob">
      ${obBack('welcome')}${obDots(1)}
      <h1 class="ob-h">Let's make your<br>little corner</h1>
      <p class="ob-p left">Just you and one other person. Nobody else can see in.</p>
      <div class="ob-form">
        ${field('obName', 'Your name', 'text', 'what should they call you?', f.name, 'given-name')}

/* ----- colour themes (saved on this phone) ----- */
const THEMES = {
  cobalt: { n: 'Blue',  a: '#2149E8', ink: '#1E3FC8', mid: '#4A67E0', tint: '#EEF1FF', dim: '#8E9BD0', hue: 0, icon: '' },
  ink:    { n: 'Black', a: '#22252E', ink: '#111318', mid: '#545A6B', tint: '#EFF0F3', dim: '#A1A6B3', hue: null, icon: '-ink' }
};
let THEME = 'cobalt';
try { const t = localStorage.getItem('hum_theme'); if (t && THEMES[t]) THEME = t; } catch (e) {}
function applyTheme(k) {
  const t = THEMES[k] || THEMES.cobalt, r = document.documentElement.style;
  r.setProperty('--accent', t.a); r.setProperty('--accent-ink', t.ink); r.setProperty('--accent-mid', t.mid);
  r.setProperty('--accent-tint', t.tint); r.setProperty('--accent-dim', t.dim);
  r.setProperty('--art-filter', t.hue === null ? 'grayscale(1) brightness(.55)' : t.hue ? `hue-rotate(${t.hue}deg)` : 'none');
  const m = document.querySelector('meta[name="theme-color"]'); if (m && !document.getElementById('splash')) m.setAttribute('content', '#ffffff');
  // the icon a phone saves when you install: blue tile or black tile, matching the theme at that moment
  const mf = document.querySelector('link[rel="manifest"]'); if (mf) mf.setAttribute('href', t.icon ? 'manifest-ink.webmanifest' : 'manifest.webmanifest');
  const ati = document.querySelector('link[rel="apple-touch-icon"]'); if (ati && /^https?:$/.test(location.protocol)) ati.setAttribute('href', `apple-touch-icon${t.icon}.png`);
  THEME = k; try { localStorage.setItem('hum_theme', k); } catch (e) {}
}
const themeSwatches = () => Object.entries(THEMES).map(([k, t]) => `<button class="press theme-sw" data-act="theme" data-k="${k}" aria-pressed="${k === THEME}" aria-label="${t.n}" style="--c:${t.a}"><span class="rec" aria-hidden="true"><span class="lbl"></span><span class="hole"></span></span><span class="theme-lbl">${t.n}</span></button>`).join('');
applyTheme(THEME);

function emptyHero() {
  return `<div class="px" style="margin-top:18px"><section class="inv-hero" aria-label="Add your first song">
    <div class="inv-pair" aria-hidden="true"><span class="pin a">${esc(ME.ini)}</span><span class="joined-heart" style="margin:0">${I.heart('currentColor', 14)}</span><span class="pin b">${esc(P.ini)}</span></div>
    <div class="inv-t">Your first song together</div>
    <p class="inv-p">Add a song you both love${simulate() ? `. ${esc(P.name)} gets a ping when you play it.` : ' and start your little library.'}</p>
    <div class="inv-actions"><button class="press ob-btn small" data-act="tab" data-tab="upload">Add a song</button></div>
  </section></div>`;
}
function inviteHero() {
  const pending = PAIR.state === 'pending';
  return `<div class="px" style="margin-top:18px"><section class="inv-hero" aria-label="Invite your person">
    <div class="inv-pair" aria-hidden="true"><span class="pin a">${esc(ME.ini)}</span>${pending ? '<span class="wait-line"><i></i><i></i><i></i></span>' : '<span class="inv-dash"></span>'}<span class="pin b ${pending ? 'waiting' : 'empty'}">${pending ? esc(initials(PAIR.name)) : '+'}</span></div>
    <div class="inv-t">${pending ? `Waiting for ${esc(PAIR.name)}` : 'humm.. is better for two'}</div>
    <p class="inv-p">${pending ? `Your invite is out. Share the code <b>${esc(PAIR.code)}</b> in case it's hiding in spam.` : 'Invite your person to listen together, leave little notes and see how far apart you are.'}</p>
    <div class="inv-actions">
      ${pending ? `<button class="press ob-btn small" data-act="appshare">Share invite link</button><button class="press ob-btn small ghost" data-act="invitesheet">Details</button>`

  </section></div>`;
}
function inviteSheet() {

function appInvite() {
